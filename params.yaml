base:
  seed: 42

prepare:
  img_size: 128          # изображения приводятся к квадрату img_size x img_size

augment:
  copies: 2              # сколько аугментированных копий генерировать на одно изображение
  max_rotation: 20       # градусы
  crop_scale_min: 0.75   # минимальная доля площади при случайной обрезке
  brightness: 0.25       # +-25 % яркости
  contrast: 0.25         # +-25 % контраста
  saturation: 0.25       # +-25 % насыщенности
  noise_std: 6.0         # СКО гауссовского шума (в единицах яркости 0..255)
  blur_prob: 0.3         # вероятность размытия

featurize:
  hog_orientations: 9
  hog_cell: 16
  hog_block: 2
  color_bins: 8
  lbp_points: 8
  lbp_radius: 1

train:
  model: logreg          # logreg | svm | rf | hgb | knn
  use_augmented: true    # обучаться на исходных (false) или исходных + аугментированных (true)
  pca_components: 0      # 0 — без PCA

models:
  logreg:
    C: 0.01
    max_iter: 3000
  svm:
    C: 5.0
    gamma: scale
  rf:
    n_estimators: 400
    max_depth: 0         # 0 — без ограничения
    min_samples_leaf: 1
  hgb:
    learning_rate: 0.1
    max_iter: 300
    max_leaf_nodes: 31
  knn:
    n_neighbors: 5
    weights: distance
